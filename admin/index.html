<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Motive Dealers | Admin</title>
<style>
:root{--gold:#e5bd78}*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:15px Arial}
header{padding:22px 5%;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}header span{color:var(--gold)}main{width:min(1050px,92%);margin:30px auto}
.panel{background:#111;border:1px solid #383838;border-radius:12px;padding:22px;margin-bottom:20px}
h1{font-size:25px}h2{font-size:20px}input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;background:#191919;color:#fff;border:1px solid #444;border-radius:7px}
textarea{min-height:80px}.btn{padding:11px 15px;border:1px solid var(--gold);border-radius:7px;background:var(--gold);color:#111;font-weight:bold;cursor:pointer}
.secondary{background:transparent;color:var(--gold)}.danger{background:#4a1717;color:white;border-color:#8c3333}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid #393939;border-radius:8px;margin:10px 0}
.item img{width:90px;height:65px;object-fit:cover}.info{flex:1;min-width:150px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.muted{color:#bbb}#status{color:var(--gold);white-space:pre-wrap}.hide{display:none!important}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><b>ALL <span>MOTIVE</span> DEALERS · ADMIN</b><a class="btn secondary" href="../">View website</a></header>
<main>
<section id="login" class="panel"><h1>Manager sign in</h1>
<form id="loginForm"><label>Email</label><input id="email" type="email" value="pmumo762@gmail.com" required>
<label>Password</label><input id="password" type="password" required>
<button class="btn">Sign in</button></form></section>
<section id="dash" class="hide">
<div class="row" style="align-items:center"><h1>Vehicle manager</h1><button id="logout" class="btn secondary">Sign out</button></div>
<div class="panel"><h2 id="formHeading">Add vehicle</h2><form id="carForm">
<input id="id" type="hidden">
<div class="row"><div>Make<input id="make" required></div><div>Model<input id="model" required></div>
<div>Year<input id="year" type="number" min="1900" max="2100"></div><div>Price (KSh)<input id="price" type="number" min="0"></div></div>
<label>Display title</label><input id="title">
<label>Specifications / description</label><textarea id="spec"></textarea>
<label>Photos (JPEG, PNG, WebP; max 12 MB each)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<p id="photoInfo" class="muted"></p><button class="btn">Save vehicle</button> <button type="button" id="cancel" class="btn secondary">Cancel</button>
</form></div>
<div class="panel"><h2>All vehicles</h2><div id="cars"></div></div>
</section><p id="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const MANAGER='pmumo762@gmail.com',BUCKET='vehicle-photos';
const el=id=>document.getElementById(id);let photoUrls=[],rows=[];
const say=t=>el('status').textContent=t;
const cash=n=>n==null?'Price on enquiry':'KSh '+Number(n).toLocaleString('en-KE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dashboard(){el('login').classList.add('hide');el('dash').classList.remove('hide')}
async function sessionCheck(){const {data:{session}}=await db.auth.getSession();if(session?.user?.email===MANAGER){dashboard();load()}else if(session){await db.auth.signOut()}}
el('loginForm').onsubmit=async e=>{e.preventDefault();say('Signing in...');const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)return say(error.message);if(data.user.email!==MANAGER){await db.auth.signOut();return say('Not authorised.')}dashboard();load();say('Signed in.')};
el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
function reset(){el('carForm').reset();el('id').value='';photoUrls=[];el('formHeading').textContent='Add vehicle';el('photoInfo').textContent=''}
el('cancel').onclick=reset;
async function upload(files){let out=[];for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>12*1024*1024)throw Error('Use JPEG, PNG or WebP photos up to 12 MB each.');let path=crypto.randomUUID()+'-'+f.name.replace(/[^a-z0-9._-]/gi,'_');let {error}=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(error)throw error;out.push(db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl)}return out}
el('carForm').onsubmit=async e=>{e.preventDefault();say('Saving...');try{
const extra=await upload([...el('photos').files]);
const payload={make:el('make').value.trim(),model:el('model').value.trim(),year:el('year').value?Number(el('year').value):null,price:el('price').value?Number(el('price').value):null,title:el('title').value.trim()||el('make').value+' '+el('model').value,spec:el('spec').value.trim(),photos:[...photoUrls,...extra],sold:false};
let q=el('id').value?db.from('vehicles').update(payload).eq('id',el('id').value):db.from('vehicles').insert(payload);
let {error}=await q;if(error)throw error;reset();await load();say('Saved successfully.')}catch(err){say('Error: '+err.message)}};
async function load(){let {data,error}=await db.from('vehicles').select('*').order('created_at',{ascending:false});if(error)return say(error.message);rows=data||[];
el('cars').innerHTML=rows.map(v=>`<div class="item"><img src="${esc((v.photos||[])[0]||'')}" alt=""><div class="info"><b>${esc(v.title||v.make+' '+v.model)}</b><br><span class="muted">${cash(v.price)} · ${v.sold?'SOLD':'AVAILABLE'}</span></div><div class="actions"><button class="btn secondary" onclick="edit('${v.id}')">Edit</button><button class="btn secondary" onclick="sold('${v.id}',${!!v.sold})">${v.sold?'Mark available':'Mark sold'}</button><button class="btn danger" onclick="del('${v.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No vehicles yet.</p>'}
window.edit=id=>{let v=rows.find(x=>String(x.id)===String(id));if(!v)return;el('id').value=v.id;for(let k of ['make','model','year','price','title','spec'])el(k).value=v[k]??'';photoUrls=v.photos||[];el('photoInfo').textContent=photoUrls.length+' existing photo(s); new uploads will be added.';el('formHeading').textContent='Edit vehicle';scrollTo({top:0,behavior:'smooth'})};
window.sold=async(id,was)=>{let {error}=await db.from('vehicles').update({sold:!was}).eq('id',id);if(error)return say(error.message);await load();say('Vehicle status updated.')};
window.del=async id=>{if(!confirm('Delete this vehicle record?'))return;let {error}=await db.from('vehicles').delete().eq('id',id);if(error)return say(error.message);await load();say('Vehicle deleted.')};
db.auth.onAuthStateChange((_e,s)=>{if(!s){el('dash').classList.add('hide');el('login').classList.remove('hide')}});
sessionCheck();
</script></body></html>
